<!doctype html>
<head>
  <meta charset=UTF-8>
  <title>София Улесова</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 20px; padding: 40px; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; }
    h1 { color: #ff6b9d; font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { color: #888; font-size: 1.2em; margin-bottom: 30px; }
    .avatar { width: 150px; height: 150px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border-radius: 50%; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .info { background: #f9f9f9; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .info-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .info-item:last-child { border-bottom: none; }
    .label { font-weight: bold; color: #555; }
    .value { color: #333; }
    .hobbies { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    .hobby { background: #ff9a9e; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
    .quote { color: #666; font-style: italic; font-size: 0.95em; margin-top: 30px; padding: 20px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border-radius: 10px; }
  </style>
</head>
<body>
  <div class=container>
    <div class=avatar>👧</div>
    <h1>София Улесова</h1>
    <p class=subtitle>7 класс, ученица</p>
    
    <div class=info>
      <div class=info-item>
        <span class=label>Возраст</span>
        <span class=value>12-13 лет</span>
      </div>
      <div class=info-item>
        <span class=label>Класс</span>
        <span class=value>7 класс</span>
      </div>
      <div class=info-item>
        <span class=label>Школа</span>
        <span class=value>Средняя школа №1</span>
      </div>
    </div>
    
    <h3 style=color:#ff6b9d;margin:20px 0>Мои интересы</h3>
    <div class=hobbies>
      <span class=hobby>📚 Чтение</span>
      <span class=hobby>🎨 Рисование</span>
      <span class=hobby>🎵 Музыка</span>
      <span class=hobby>⚽ Спорт</span>
      <span class=hobby>💻 Компьютеры</span>
      <span class=hobby>🎬 Кино</span>
    </div>
    
    <div class=quote>
      Каждый день — это новая возможность стать лучше!
    </div>
  </div>
</body>
